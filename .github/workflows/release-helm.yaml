name: release-helm

on:
  push:
    tags:
      - "helm/v*.*.*"   # trigger: git tag helm/v0.1.0
  workflow_dispatch:
    inputs:
      chart_version:
        description: "Chart version to publish (e.g. 0.1.0)"
        required: true
      image_tag:
        description: "Image tag to pin (leave empty to auto-resolve from :main digest)"
        required: false

env:
  REGISTRY: ghcr.io
  CHART_PATH: helm/civicrm-drupal
  IMAGE: ghcr.io/${{ github.repository_owner }}/civicrm-docker-drupal

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Build chart dependencies
        run: helm dependency build ${{ env.CHART_PATH }}

      - name: Lint chart
        run: helm lint ${{ env.CHART_PATH }} --strict

  publish:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Resolve image tag
        id: image
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            # Resolve the digest of :main → convert to sha-<short> tag.
            # docker/metadata-action pushes sha-<7-char-sha> alongside :main,
            # so this pins the chart to the exact immutable image build.
            DIGEST=$(crane digest ${{ env.IMAGE }}:main)
            SHORT_SHA=$(echo "$DIGEST" | sed 's/sha256://' | cut -c1-7)
            TAG="sha-${SHORT_SHA}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Pinning image tag: ${TAG}"

      - name: Resolve chart version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "chart_version=${{ inputs.chart_version }}" >> "$GITHUB_OUTPUT"
          else
            # strip "helm/v" prefix from tag name
            echo "chart_version=${GITHUB_REF_NAME#helm/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set appVersion in Chart.yaml
        run: |
          sed -i 's/^appVersion:.*$/appVersion: "${{ steps.image.outputs.tag }}"/' \
            ${{ env.CHART_PATH }}/Chart.yaml

      - name: Build chart dependencies
        run: helm dependency build ${{ env.CHART_PATH }}

      - name: Package chart
        run: |
          helm package ${{ env.CHART_PATH }} \
            --version "${{ steps.version.outputs.chart_version }}" \
            --destination /tmp/helm-output

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Push chart to GHCR OCI registry
        run: |
          helm push /tmp/helm-output/*.tgz \
            oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
