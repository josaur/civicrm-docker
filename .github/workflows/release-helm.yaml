name: release-helm

on:
  push:
    tags:
      - "helm/v*.*.*"   # trigger: git tag helm/v0.1.0
  workflow_dispatch:
    inputs:
      chart_version:
        description: "Chart version to publish (e.g. 0.1.0)"
        required: true
      image_tag:
        description: "Image tag whose digest is pinned in the chart (default: main)"
        required: false

env:
  REGISTRY: ghcr.io
  CHART_PATH: helm/civicrm-drupal
  IMAGE: ghcr.io/${{ github.repository_owner }}/civicrm-docker-drupal-hardened

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Build chart dependencies
        run: helm dependency build ${{ env.CHART_PATH }}

      - name: Lint chart
        run: |
          helm lint ${{ env.CHART_PATH }} --strict \
            --set app.existingSecret=s --set app.drupalDb.host=db

  publish:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Resolve image tag and digest
        id: image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          TAG="${IMAGE_TAG:-main}"
          # Pin the exact build: the chart gets the immutable digest of <tag>
          DIGEST=$(crane digest "${IMAGE}:${TAG}")
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pinning ${IMAGE}:${TAG}@${DIGEST}"

      - name: Resolve chart version
        id: version
        env:
          CHART_VERSION_INPUT: ${{ inputs.chart_version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "chart_version=${CHART_VERSION_INPUT}" >> "$GITHUB_OUTPUT"
          else
            # strip "helm/v" prefix from tag name
            echo "chart_version=${GITHUB_REF_NAME#helm/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pin the image in the chart
        run: |
          sed -i 's/^appVersion:.*$/appVersion: "${{ steps.image.outputs.tag }}"/' ${{ env.CHART_PATH }}/Chart.yaml
          sed -i 's|^  digest: ""|  digest: "${{ steps.image.outputs.digest }}"|' ${{ env.CHART_PATH }}/values.yaml
          grep -n '^appVersion' ${{ env.CHART_PATH }}/Chart.yaml
          grep -n '^  digest:' ${{ env.CHART_PATH }}/values.yaml

      - name: Build chart dependencies
        run: helm dependency build ${{ env.CHART_PATH }}

      - name: Package chart
        run: |
          helm package ${{ env.CHART_PATH }} \
            --version "${{ steps.version.outputs.chart_version }}" \
            --destination /tmp/helm-output

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Push chart to GHCR OCI registry
        run: |
          helm push /tmp/helm-output/*.tgz \
            oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
