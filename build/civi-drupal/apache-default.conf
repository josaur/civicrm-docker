<VirtualHost *:80>

    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    RemoteIPHeader X-Forwarded-For

    LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" remoteip_combined
    CustomLog ${APACHE_LOG_DIR}/access.log remoteip_combined
    ErrorLog ${APACHE_LOG_DIR}/error.log

    # Apache resolves /var/www/html symlink to /opt/drupal/web — grant access to both
    <Directory /var/www/>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /opt/drupal/web>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

</VirtualHost>
