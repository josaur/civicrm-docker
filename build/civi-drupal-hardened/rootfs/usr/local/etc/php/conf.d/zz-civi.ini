; Applies to web and CLI
memory_limit = 512M
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
upload_max_filesize = 64M
post_max_size = 72M
max_execution_time = 120

; Immutable image: code does not change at runtime
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000

; Uploads/sessions only in tmpfs
upload_tmp_dir = /tmp
session.save_path = /tmp
sys_temp_dir = /tmp

; Never include code from URLs
allow_url_include = Off
allow_url_fopen = On

; Web requests are restricted further in zz-civi-hardening.conf
; (disable_functions, open_basedir). The CLI tools cv/drush need proc_open.

; APCu (shared memory cache for CiviCRM). Not used by CLI tools: a cache flushed by a one-off job does not reach the web pod,
; restart the web pod after settings or schema changes made with cv/drush.
apc.enabled = 1
apc.shm_size = 64M
apc.enable_cli = 0
