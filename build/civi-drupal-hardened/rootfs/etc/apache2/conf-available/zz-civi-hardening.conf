# Must load after security.conf (hence the "zz-" prefix), otherwise it overrides ServerTokens.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<IfModule mod_headers.c>
  # Headers set by PHP (Drupal: X-Generator) are not in the "always" table
  Header unset X-Generator
  Header unset X-Powered-By
</IfModule>

# Web requests must not be able to run system commands (cv/drush CLI tools are not affected).
<IfModule mod_php.c>
  php_admin_value disable_functions "exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl,show_source"
  php_admin_flag allow_url_include off
  php_admin_value open_basedir "/opt/drupal:/var/www/html:/data:/tmp:/run/civi-secrets:/usr/local/lib/php"
</IfModule>

# No PHP execution for user content. Two layers:
# 1) URL based (independent of symlinks/DocumentRoot)
<LocationMatch "^/sites/[^/]+/files/.*\.(php[0-9]*|phtml|phar|pht|phps|cgi|pl|py|sh)(/|$)">
  Require all denied
</LocationMatch>
# 2) Directory based: PHP engine off in the data directories (DocumentRoot is /var/www/html -> /opt/drupal/web)
<DirectoryMatch "^/(var/www/html|opt/drupal/web)/sites/[^/]+/files">
  SetHandler None
  Options -ExecCGI -Indexes
  <IfModule mod_php.c>
    php_flag engine off
  </IfModule>
</DirectoryMatch>
<DirectoryMatch "^/data">
  SetHandler None
  Options -ExecCGI -Indexes
  <IfModule mod_php.c>
    php_flag engine off
  </IfModule>
</DirectoryMatch>

# Do not serve internals
<FilesMatch "(^\.|\.(sql|bak|swp|orig|dist|inc|install|yml|twig|sh)$|composer\.(json|lock)$|^(settings|civicrm\.settings)\.php$)">
  Require all denied
</FilesMatch>
