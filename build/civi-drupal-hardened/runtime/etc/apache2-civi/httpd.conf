# Minimal Apache configuration for the distroless runtime image (no shell, no apache2ctl, no envvars).
# Everything writable lives in /tmp (tmpfs); the process runs as the unprivileged user it is started as.
ServerRoot "/etc/apache2-civi"
ServerName localhost
Listen 8080

PidFile /tmp/apache2.pid
DefaultRuntimeDir /tmp
Mutex file:/tmp default

ServerTokens Prod
ServerSignature Off
TraceEnable Off
HostnameLookups Off
UseCanonicalName Off
AccessFileName .htaccess

# Prefork is required by mod_php. A small worker pool keeps the memory use predictable (PHP memory_limit applies per worker).
StartServers 2
MinSpareServers 2
MaxSpareServers 4
MaxRequestWorkers 10
MaxConnectionsPerChild 500

Timeout 120
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
LimitRequestBody 78643200
RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500

LoadModule mpm_prefork_module /usr/lib/apache2/modules/mod_mpm_prefork.so
LoadModule authn_core_module /usr/lib/apache2/modules/mod_authn_core.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule authz_host_module /usr/lib/apache2/modules/mod_authz_host.so
LoadModule access_compat_module /usr/lib/apache2/modules/mod_access_compat.so
LoadModule alias_module /usr/lib/apache2/modules/mod_alias.so
LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so
LoadModule env_module /usr/lib/apache2/modules/mod_env.so
LoadModule expires_module /usr/lib/apache2/modules/mod_expires.so
LoadModule filter_module /usr/lib/apache2/modules/mod_filter.so
LoadModule deflate_module /usr/lib/apache2/modules/mod_deflate.so
LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
LoadModule reqtimeout_module /usr/lib/apache2/modules/mod_reqtimeout.so
LoadModule rewrite_module /usr/lib/apache2/modules/mod_rewrite.so
LoadModule setenvif_module /usr/lib/apache2/modules/mod_setenvif.so
LoadModule php_module /usr/lib/apache2/modules/libphp.so

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /proc/self/fd/1 combined

TypesConfig /etc/mime.types
DirectoryIndex index.php index.html

<Directory />
    AllowOverride None
    Require all denied
</Directory>

DocumentRoot /opt/drupal/web
<Directory /opt/drupal/web>
    Options -Indexes +FollowSymLinks
    # Drupal's .htaccess (rewrite to index.php, access rules, headers) is part of the application
    AllowOverride All
    Require all granted
</Directory>

<FilesMatch "^\.ht">
    Require all denied
</FilesMatch>

<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json image/svg+xml
</IfModule>

# Security and PHP settings (disable_functions, open_basedir, no PHP in the data directories, denied internals)
IncludeOptional /etc/apache2-civi/conf/*.conf
