{{- if not .Values.app.existingSecret }}
{{- $fullname := include "civicrm-drupal.fullname" . }}
{{- $secretName := printf "%s-app" $fullname }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $siteKey   := .Values.app.civicrmSiteKey   | default (dig "data" "civicrm-site-key"  "" $existing | b64dec) | default (randAlphaNum 32) }}
{{- $credKeys  := .Values.app.civicrmCredKeys  | default (dig "data" "civicrm-cred-keys" "" $existing | b64dec) | default (printf "aes-cbc:hkdf-sha256:%s" (randAlphaNum 49)) }}
{{- $signKeys  := .Values.app.civicrmSignKeys  | default (dig "data" "civicrm-sign-keys" "" $existing | b64dec) | default (printf "jwt-hs256:hkdf-sha256:%s" (randAlphaNum 54)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "civicrm-drupal.labels" . | nindent 4 }}
type: Opaque
stringData:
  drupal-admin-password: {{ .Values.app.drupal.admin.password | quote }}
  drupal-db-password: {{ .Values.app.drupalDb.password | quote }}
  civicrm-db-password: {{ .Values.app.civicrmDb.password | default .Values.app.drupalDb.password | quote }}
  civicrm-site-key: {{ $siteKey | quote }}
  civicrm-cred-keys: {{ $credKeys | quote }}
  civicrm-sign-keys: {{ $signKeys | quote }}
{{- end }}
