{{- if .Values.persistence.files.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "civicrm-drupal.fullname" . }}-files
  labels:
    {{- include "civicrm-drupal.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.files.accessMode }}
  {{- if .Values.persistence.files.storageClass }}
  storageClassName: {{ .Values.persistence.files.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.files.size }}
{{- end }}
{{- if .Values.persistence.private.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "civicrm-drupal.fullname" . }}-private
  labels:
    {{- include "civicrm-drupal.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.private.accessMode }}
  {{- if .Values.persistence.private.storageClass }}
  storageClassName: {{ .Values.persistence.private.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.private.size }}
{{- end }}
