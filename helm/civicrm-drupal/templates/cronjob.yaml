{{- if .Values.cronjob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "civicrm-drupal.fullname" . }}-cron
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "civicrm-drupal.labels" . | nindent 4 }}
    app.kubernetes.io/component: cron
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  concurrencyPolicy: {{ .Values.cronjob.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.cronjob.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "civicrm-drupal.name" . }}-cron
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: cron
        spec:
          restartPolicy: OnFailure
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          automountServiceAccountToken: false
          enableServiceLinks: false
          {{- with .Values.priorityClassName }}
          priorityClassName: {{ . }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          {{- if and .Values.cronjob.coLocate .Values.persistence.enabled }}
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      {{- include "civicrm-drupal.selectorLabels" . | nindent 22 }}
          {{- end }}
          {{- if .Values.extensions }}
          initContainers:
            {{- include "civicrm-drupal.extensionsInitContainer" . | nindent 12 }}
          {{- end }}
          containers:
            - name: cron
              image: {{ include "civicrm-drupal.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              # Bypass the web entrypoint: only the cron commands.
              command:
                - sh
                - -c
                - |
                  set -e
                  mkdir -p /tmp/civicrm/templates_c /tmp/drupal-php
                  cd /opt/drupal/web
                  echo "Running Drupal cron..."
                  drush --uri="$CIVICRM_BASE_URL" cron
                  echo "Running CiviCRM scheduled jobs..."
                  cv api job.execute
                  echo "Done."
              env:
                {{- include "civicrm-drupal.env" . | nindent 16 }}
              resources:
                {{- toYaml .Values.cronjob.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                {{- include "civicrm-drupal.secretMount" . | nindent 16 }}
                {{- if .Values.persistence.enabled }}
                - name: data
                  mountPath: /data
                {{- end }}
                {{- if .Values.extensions }}
                {{- include "civicrm-drupal.extensionsMount" . | nindent 16 }}
                {{- end }}
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: {{ .Values.tmp.sizeLimit }}
            {{- include "civicrm-drupal.secretVolume" . | nindent 12 }}
            {{- if .Values.persistence.enabled }}
            - name: data
              persistentVolumeClaim:
                claimName: data-{{ include "civicrm-drupal.fullname" . }}-0
            {{- else }}
            - name: data
              emptyDir: {}
            {{- end }}
            {{- if .Values.extensions }}
            {{- include "civicrm-drupal.extensionsVolumes" . | nindent 12 }}
            {{- end }}
{{- end }}
