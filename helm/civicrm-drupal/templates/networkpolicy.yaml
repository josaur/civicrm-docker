{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "civicrm-drupal.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "civicrm-drupal.labels" . | nindent 4 }}
spec:
  # The application pods and the cron job pods
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    {{- range .Values.networkPolicy.egressPorts }}
    - ports:
        - port: {{ .port }}
          protocol: {{ .protocol | default "TCP" }}
      {{- with $.Values.networkPolicy.egressTo }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
