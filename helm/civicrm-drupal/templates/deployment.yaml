apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "civicrm-drupal.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "civicrm-drupal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # OrderedReady: each pod is Ready before the next one starts.
  podManagementPolicy: OrderedReady
  serviceName: {{ include "civicrm-drupal.fullname" . }}-headless
  selector:
    matchLabels:
      {{- include "civicrm-drupal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.extensions }}
        checksum/extensions: {{ include (print $.Template.BasePath "/configmap-extensions.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "civicrm-drupal.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The application does not talk to the Kubernetes API
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- include "civicrm-drupal.initContainer" . | nindent 8 }}
      containers:
        - name: drupal
          image: {{ include "civicrm-drupal.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- include "civicrm-drupal.env" . | nindent 12 }}
          startupProbe:
            httpGet:
              path: {{ .Values.probePaths.startup }}
              port: http
              httpHeaders:
                - name: Host
                  value: {{ include "civicrm-drupal.probeHost" . | quote }}
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probePaths.liveness }}
              port: http
              httpHeaders:
                - name: Host
                  value: {{ include "civicrm-drupal.probeHost" . | quote }}
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probePaths.readiness }}
              port: http
              httpHeaders:
                - name: Host
                  value: {{ include "civicrm-drupal.probeHost" . | quote }}
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "civicrm-drupal.secretMount" . | nindent 12 }}
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- if .Values.extensions }}
            {{- include "civicrm-drupal.extensionsMount" . | nindent 12 }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.tmp.sizeLimit }}
        {{- include "civicrm-drupal.secretVolume" . | nindent 8 }}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if .Values.extensions }}
        {{- include "civicrm-drupal.extensionsVolumes" . | nindent 8 }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
