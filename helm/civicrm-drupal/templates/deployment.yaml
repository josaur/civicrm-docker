apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "civicrm-drupal.fullname" . }}
  labels:
    {{- include "civicrm-drupal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # OrderedReady ensures each pod is Ready before the next starts.
  # This prevents concurrent AUTO_INSTALL runs against the same database.
  podManagementPolicy: OrderedReady
  serviceName: {{ include "civicrm-drupal.fullname" . }}-headless
  selector:
    matchLabels:
      {{- include "civicrm-drupal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "civicrm-drupal.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: drupal
          image: "{{ .Values.image.repository }}:{{ include "civicrm-drupal.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            # --- Drupal database ---
            - name: DRUPAL_DB_HOST
              value: {{ include "civicrm-drupal.dbHost" . | quote }}
            - name: DRUPAL_DB_PORT
              value: {{ .Values.app.drupalDb.port | quote }}
            - name: DRUPAL_DB_NAME
              value: {{ .Values.app.drupalDb.name | quote }}
            - name: DRUPAL_DB_USER
              value: {{ .Values.app.drupalDb.user | quote }}
            - name: DRUPAL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.existingSecret | default (printf "%s-app" (include "civicrm-drupal.fullname" .)) }}
                  key: drupal-db-password

            # --- CiviCRM database ---
            - name: CIVICRM_DB_HOST
              value: {{ include "civicrm-drupal.civicrmDbHost" . | quote }}
            - name: CIVICRM_DB_PORT
              value: {{ .Values.app.civicrmDb.port | quote }}
            - name: CIVICRM_DB_NAME
              value: {{ .Values.app.civicrmDb.name | quote }}
            - name: CIVICRM_DB_USER
              value: {{ include "civicrm-drupal.civicrmDbUser" . | quote }}
            - name: CIVICRM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.existingSecret | default (printf "%s-app" (include "civicrm-drupal.fullname" .)) }}
                  key: civicrm-db-password

            # --- Drupal admin ---
            - name: DRUPAL_ADMIN_USER
              value: {{ .Values.app.drupal.admin.user | quote }}
            - name: DRUPAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.existingSecret | default (printf "%s-app" (include "civicrm-drupal.fullname" .)) }}
                  key: drupal-admin-password
            - name: DRUPAL_ADMIN_EMAIL
              value: {{ .Values.app.drupal.admin.email | quote }}
            - name: DRUPAL_SITE_NAME
              value: {{ .Values.app.drupal.siteName | quote }}

            # --- URLs ---
            - name: DRUPAL_BASE_URL
              value: {{ .Values.app.drupal.baseUrl | quote }}

            # --- Behaviour ---
            - name: AUTO_INSTALL
              value: {{ .Values.app.autoInstall | quote }}
            - name: AUTO_UPDATE
              value: {{ .Values.app.autoUpdate | quote }}
            - name: CIVICRM_EXTENSIONS
              value: {{ .Values.app.civicrmExtensions | quote }}

            # --- Cron ---
            - name: CRON_SCHEDULE
              value: {{ .Values.app.cronSchedule | quote }}

            # --- CiviCRM security keys ---
            - name: CIVICRM_SITE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.existingSecret | default (printf "%s-app" (include "civicrm-drupal.fullname" .)) }}
                  key: civicrm-site-key
                  optional: true
            - name: CIVICRM_CRED_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.existingSecret | default (printf "%s-app" (include "civicrm-drupal.fullname" .)) }}
                  key: civicrm-cred-keys
                  optional: true
            - name: CIVICRM_SIGN_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.existingSecret | default (printf "%s-app" (include "civicrm-drupal.fullname" .)) }}
                  key: civicrm-sign-keys
                  optional: true

          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            {{- if .Values.persistence.sites.enabled }}
            - name: drupal-sites
              mountPath: /opt/drupal/web/sites/default/files
            {{- end }}
            {{- if .Values.persistence.private.enabled }}
            - name: drupal-private
              mountPath: /opt/drupal/private
            {{- end }}
            - name: civicrm-settings
              mountPath: /opt/drupal/web/sites/default/civicrm.settings.php
              subPath: civicrm.settings.php
              readOnly: true

      volumes:
        - name: civicrm-settings
          configMap:
            name: {{ include "civicrm-drupal.fullname" . }}-civicrm-settings
            defaultMode: 0444

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

  {{- if or .Values.persistence.sites.enabled .Values.persistence.private.enabled }}
  volumeClaimTemplates:
    {{- if .Values.persistence.sites.enabled }}
    - metadata:
        name: drupal-sites
      spec:
        accessModes:
          - {{ .Values.persistence.sites.accessMode }}
        {{- if .Values.persistence.sites.storageClass }}
        storageClassName: {{ .Values.persistence.sites.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.sites.size }}
    {{- end }}
    {{- if .Values.persistence.private.enabled }}
    - metadata:
        name: drupal-private
      spec:
        accessModes:
          - {{ .Values.persistence.private.accessMode }}
        {{- if .Values.persistence.private.storageClass }}
        storageClassName: {{ .Values.persistence.private.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.private.size }}
    {{- end }}
  {{- end }}
